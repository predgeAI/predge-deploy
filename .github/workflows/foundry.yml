name: contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundry:
    name: forge build / test / coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Build
        run: forge build --sizes

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Forge runtime == deploy runtime
        run: npm ci && node --test test/forge-parity.test.mjs

      # Tests named test_BUG_* deliberately fail: each one pins a known issue reported in the
      # self-audit and stays red until the contract is fixed. They are run separately below.
      - name: Test (unit, fuzz, invariant)
        run: forge test -vvv --no-match-test test_BUG_
        env:
          FOUNDRY_PROFILE: ci

      - name: Known-issue tests (expected to fail until fixed)
        run: forge test --match-test test_BUG_ || true

      - name: Coverage
        run: |
          forge coverage --no-match-test test_BUG_ --no-match-coverage "test/" --report summary --report lcov
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  bytecode:
    name: JS tests (plan + bytecode match against live deployments)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  slither:
    name: slither (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install slither + solc 0.8.26
        run: |
          pip install slither-analyzer==0.11.6 solc-select==1.2.0
          solc-select install 0.8.26 && solc-select use 0.8.26
      - name: Run slither on each contract with the deploy compiler settings
        run: |
          for f in contracts/*.sol; do
            slither "$f" --compile-force-framework solc \
              --solc-args "--optimize --optimize-runs 200 --evm-version cancun" \
              --exclude-informational --exclude-optimization || true
          done
